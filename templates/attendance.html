<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Konfirmasi Kehadiran — Doorprize PRO</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#071225;--card:#0d172c;--line:#24314a;--text:#f5f7fb;--muted:#9ba8bf;--green:#22c55e;--red:#ef4444;--gold:#f5c451;--blue:#4f8cff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#060c1b,#0a1930);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}.brand{font-size:27px;font-weight:800}.brand span{color:var(--gold)}.sub{color:var(--muted);margin-top:5px}.btn{border:1px solid var(--line);background:#111b31;color:#fff;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(1.15)}.btn.primary{background:#173d83;border-color:#2858a5}.btn.green{background:#0e6130;border-color:#199449}.btn.red{background:#5d1921;border-color:#9d2936}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{background:rgba(10,20,39,.94);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 20px 60px #0003}.scanner{min-height:470px}.reader{width:100%;max-width:850px;margin:auto;min-height:360px;border:2px dashed #53627c;border-radius:18px;overflow:hidden;background:#f6f7fb;color:#111}.controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.manual{display:flex;gap:10px;margin-top:14px}.manual input{flex:1;min-width:180px;background:#071020;border:1px solid var(--line);color:#fff;border-radius:12px;padding:14px;font-size:16px}.result{margin-top:15px;padding:15px;border-radius:14px;border:1px solid var(--line);background:#0a1428;min-height:72px}.ok{border-color:#1e9d50;background:#082518}.warn{border-color:#b7791f;background:#2a1d08}.err{border-color:#a42b37;background:#2a0b11}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:16px;border-radius:14px;background:#0a1427;border:1px solid var(--line)}.stat b{display:block;font-size:28px;margin-top:4px}.filters{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}.pill{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#0a1427;color:#fff;cursor:pointer;font-weight:700}.pill.active{background:#214a86}.table{max-height:430px;overflow:auto;border:1px solid var(--line);border-radius:14px}.row{display:grid;grid-template-columns:70px 1.5fr 1fr 150px;gap:10px;padding:12px;border-bottom:1px solid #1b2740;align-items:center}.head{position:sticky;top:0;background:#101b31;font-weight:800}.badge{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900}.hadir{background:#0c4c28;color:#76ef9d}.belum{background:#4b3510;color:#ffd66b}.menang{background:#3d275d;color:#d7b5ff}.toast{position:fixed;right:20px;bottom:20px;max-width:450px;padding:15px 18px;border-radius:14px;background:#101b31;border:1px solid var(--line);display:none;z-index:20}.small{font-size:13px;color:var(--muted)}@media(max-width:1000px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:50px 1fr 110px}.row .dept{display:none}}@media(max-width:600px){.wrap{padding:12px}.stats{grid-template-columns:1fr}.manual{flex-direction:column}}
</style></head>
<body><div class="wrap">
<div class="top"><div><div class="brand">🎁 Doorprize <span>PRO</span> — Konfirmasi Kehadiran</div><div class="sub">Scan QR peserta. <b style="color:#fff">Hanya peserta yang sudah HADIR yang dapat diundi.</b></div></div><button class="btn" onclick="location.href='/'">← Dashboard</button></div>
<div class="grid">
<section class="card scanner"><h2>📷 Scanner QR</h2><div id="reader" class="reader"></div><div class="controls"><button id="startBtn" class="btn primary" onclick="startScanner()">📷 Mulai Scanner</button><button id="stopBtn" class="btn" onclick="stopScanner()">■ Stop</button></div><div class="manual"><input id="ticketInput" placeholder="Nomor tiket — alternatif jika scanner tidak tersedia"><button class="btn green" onclick="confirmTicket()">✓ Konfirmasi Hadir</button></div><div id="result" class="result">Arahkan kamera ke QR Code peserta.</div></section>
<section class="card"><h2>📊 Status Kehadiran</h2><div class="stats"><div class="stat">Total Peserta<b id="total">0</b></div><div class="stat">Hadir<b id="hadir">0</b></div><div class="stat">Belum Hadir<b id="belum">0</b></div></div><div class="filters"><button class="pill active" data-filter="ALL" onclick="setFilter('ALL',this)">Semua</button><button class="pill" data-filter="HADIR" onclick="setFilter('HADIR',this)">✅ Hadir</button><button class="pill" data-filter="BELUM_HADIR" onclick="setFilter('BELUM_HADIR',this)">⏳ Belum Hadir</button></div><div class="table"><div class="row head"><div>No</div><div>Nama / Tiket</div><div class="dept">Departemen</div><div>Status</div></div><div id="list"></div></div></section>
</div></div><div id="toast" class="toast"></div>
<script>
let scanner=null, running=false, rows=[], filter='ALL', busy=false;
const $=id=>document.getElementById(id);
function toast(msg,kind=''){const t=$('toast');t.textContent=msg;t.style.display='block';t.style.borderColor=kind==='ok'?'#1e9d50':kind==='err'?'#a42b37':'#24314a';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',3500)}
async function jsonFetch(url,opt={}){const r=await fetch(url,opt);const text=await r.text();let data;try{data=JSON.parse(text)}catch(e){throw new Error('Server mengirim respons bukan JSON (HTTP '+r.status+').')};if(!r.ok)throw new Error(data.error||'Request gagal');return data}
async function loadAttendance(){try{rows=await jsonFetch('/api/attendance');render()}catch(e){toast(e.message,'err')}}
function render(){const h=rows.filter(r=>String(r.attendance_status).toUpperCase()==='HADIR').length; $('total').textContent=rows.length;$('hadir').textContent=h;$('belum').textContent=rows.length-h;const visible=rows.filter(r=>filter==='ALL'||String(r.attendance_status).toUpperCase()===filter);$('list').innerHTML=visible.map((r,i)=>{let s=String(r.attendance_status).toUpperCase();return `<div class="row"><div>${i+1}</div><div><b>${esc(r.name)}</b><div class="small">${esc(r.ticket||'-')}</div></div><div class="dept small">${esc(r.department||'-')}</div><div><span class="badge ${s==='HADIR'?'hadir':'belum'}">${s==='HADIR'?'✓ HADIR':'⏳ BELUM HADIR'}</span>${r.is_winner?'<span class="badge menang">🏆 SUDAH MENANG</span>':''}</div></div>`}).join('')||'<div style="padding:25px;text-align:center;color:#9ba8bf">Belum ada data peserta.</div>'}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function setFilter(v,el){filter=v;document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
async function confirmToken(token){if(busy)return;busy=true;try{const d=await jsonFetch('/api/attendance/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});showResult(d);await loadAttendance()}catch(e){showResult({success:false,message:e.message},true)}finally{busy=false}}
async function confirmTicket(){const v=$('ticketInput').value.trim();if(!v){showResult({success:false,message:'Nomor tiket belum diisi.'},true);return}if(busy)return;busy=true;try{const d=await jsonFetch('/api/attendance/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticket:v})});showResult(d);$('ticketInput').value='';await loadAttendance()}catch(e){showResult({success:false,message:e.message},true)}finally{busy=false}}
function showResult(d,failed=false){const p=d.participant||{};const box=$('result');if(d.success){box.className='result '+(d.already?'warn':'ok');box.innerHTML=`<b>${d.already?'⚠️ PESERTA SUDAH HADIR':'✅ KEHADIRAN BERHASIL'}</b><br>${esc(p.name||'')} — <b>${esc(p.ticket||'')}</b><br><span class="small">${esc(d.message||'')}</span>`;toast(d.message||'Berhasil','ok')}else{box.className='result err';box.textContent='❌ '+(d.message||'Gagal');toast(d.message||'Gagal','err')}}
async function startScanner(){if(running)return; if(typeof Html5Qrcode==='undefined'){showResult({success:false,message:'Library scanner belum termuat. Periksa koneksi internet.'},true);return}try{scanner=new Html5Qrcode('reader');const config={fps:10,qrbox:{width:260,height:260},aspectRatio:1.0};await scanner.start({facingMode:'environment'},config,(decoded)=>confirmToken(decoded),()=>{});running=true;$('startBtn').disabled=true;toast('Scanner aktif. Arahkan kamera ke QR peserta.','ok')}catch(e){running=false;scanner=null;showResult({success:false,message:'Kamera tidak dapat dijalankan: '+e.message},true)}}
async function stopScanner(){if(!scanner){running=false;return}try{await scanner.stop();await scanner.clear()}catch(e){}scanner=null;running=false;$('startBtn').disabled=false;toast('Scanner dihentikan.')}
$('ticketInput').addEventListener('keydown',e=>{if(e.key==='Enter')confirmTicket()});loadAttendance();setInterval(loadAttendance,5000);
</script></body></html>
