<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kartu Peserta QR</title><style>body{margin:0;background:#eef2f7;font-family:Segoe UI,Arial;color:#0d1730}.top{padding:18px;background:#0d1b35;color:#fff;display:flex;justify-content:space-between}.btn{background:#fff;color:#0d1730;border:0;border-radius:10px;padding:10px 15px;font-weight:800}.grid{padding:25px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border-radius:18px;padding:24px;text-align:center;box-shadow:0 10px 30px #0001}.card img{width:260px;max-width:100%;image-rendering:auto}.ticket{font-size:20px;font-weight:800}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><b>🎫 Kartu Peserta QR — Doorprize PRO</b><div><button class="btn" onclick="location.href='/attendance'">Konfirmasi Kehadiran</button><button class="btn" onclick="location.href='/api/qr/all.zip'">Download Semua Kartu PDF ZIP</button></div></div><div class="grid">{% for p in participants %}<article class="card"><h2>{{p.name}}</h2><div class="ticket">No. Tiket: {{p.ticket or '-'}}</div><p>{{p.department or ''}}</p><img src="{{p.qr_image}}" alt="QR {{p.ticket}}"><p>Scan QR untuk konfirmasi kehadiran</p><a class="download-qr" href="{{ url_for('download_participant_qr', participant_id=p.id) }}" download>⬇ Download Kartu PDF</a></article>{% endfor %}</div></body></html>
