<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Admin — Doorprize PRO</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#071225,#111b36);color:#fff}.box{width:min(440px,92vw);background:#0d172c;border:1px solid #2a3855;border-radius:24px;padding:34px;box-shadow:0 24px 70px #0008}.logo{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:#173d83;font-size:30px;margin-bottom:18px}.title{font-size:28px;font-weight:900}.sub{color:#aeb9cc;margin:7px 0 25px}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:14px 15px;border:1px solid #33425f;border-radius:12px;background:#081124;color:#fff;font-size:16px;outline:none}.field input:focus{border-color:#5d8ff0}.btn{width:100%;border:0;border-radius:12px;padding:14px;background:#285bb6;color:#fff;font-weight:900;font-size:16px;cursor:pointer;margin-top:8px}.err{background:#54202a;border:1px solid #9e3d4d;color:#ffd8dd;border-radius:10px;padding:11px 13px;margin:12px 0}.hint{font-size:12px;color:#8190aa;margin-top:18px;text-align:center}.back{display:block;text-align:center;color:#aeb9cc;text-decoration:none;margin-top:16px;font-size:14px}</style></head>
<body><main class="box"><div class="logo">🔐</div><div class="title">Login Admin</div><div class="sub">Akses khusus menu <b>Registrasi &amp; Pengaturan</b></div>{% if error %}<div class="err">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="next" value="{{ next }}"><div class="field"><label>Username</label><input name="username" autocomplete="username" autofocus required></div><div class="field"><label>Password</label><input type="password" name="password" autocomplete="current-password" required></div><button class="btn" type="submit">🔑 Masuk sebagai Admin</button></form><div class="hint">Akses admin diperlukan untuk input peserta, hadiah, upload Excel, logo, dan pengaturan acara.</div><a class="back" href="/">← Kembali ke Dashboard</a></main></body></html>
